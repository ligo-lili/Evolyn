name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux exercises the WAL / SIGKILL / path semantics for the first
        # time; findings feed the hardening punch list.
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # The project lives under agent-harness/ in this repository.
    defaults:
      run:
        working-directory: agent-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # offline retrieval-quality gate (FTS mode): recall@5 + blind-spot check
      - run: npm run eval:memory
